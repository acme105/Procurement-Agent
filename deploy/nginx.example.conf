# Add inside the http {} block of an nginx that already serves other sites. Replace the hostname and the upstream address.
# Get the certificate first (needs only the port-80 block):  certbot certonly --webroot -w /var/www/certbot -d aerchain.example.com
server {
    listen 80;
    server_name aerchain.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name aerchain.example.com;
    ssl_certificate     /etc/letsencrypt/live/aerchain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aerchain.example.com/privkey.pem;

    client_max_body_size 25m;                 # vendor uploads
    location / {
        proxy_pass http://172.17.0.1:8085;    # the host, as seen from a Docker nginx; use 127.0.0.1 for an nginx on the host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                  # the chat streams its replies
        proxy_read_timeout 300s;
    }
}
